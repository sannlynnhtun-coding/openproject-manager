[package]
name = "openproject-manager"
version = "1.0.0"
edition = "2024"
build = "build.rs"

[dependencies]
gpui-kit = { version = "=0.8.0", optional = true }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = { version = "0.15", optional = true }
open = { version = "5", optional = true }
tray-icon = { version = "=0.21.3", optional = true, default-features = false }
raw-window-handle = { version = "0.6", optional = true }

[features]
default = ["gui"]
gui = ["dep:gpui-kit", "dep:rfd", "dep:open", "dep:tray-icon", "dep:raw-window-handle"]

[[bin]]
name = "openproject-manager"
path = "src/main.rs"
required-features = ["gui"]

[build-dependencies]
winresource = "0.1"

[profile.release]
strip = true

[patch.crates-io]
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }

